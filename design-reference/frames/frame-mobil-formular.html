<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TSC Versicherung — Design-Referenz: Mobil Formular</title>
<!--
  Bu dosya Claude Design artifact'inden (claude.ai/artifact/C167a5rjjkbYDNmiadWxXA)
  çıkarılmış DOKÜMANTASYON amaçlı bir statik export'tur. Sadece görsel referans
  için kullanılır, üretim kodunun parçası DEĞİLDİR. Google Fonts CDN sadece bu
  önizleme dosyasının çalışması için var — production'da fontlar self-host edilir
  (bkz. CLAUDE.md "Tipografi" ve TOKENS.md).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#EEF1F5;font-family:'Source Sans 3',system-ui,sans-serif;color:#0B2E59;padding:40px}
  *{box-sizing:border-box}
  a{color:#0F5AA6;text-decoration:none}
  a:hover{color:#0B2E59;text-decoration:underline}
  h1,h2,h3,h4{font-family:'Libre Franklin',system-ui,sans-serif;margin:0;text-wrap:pretty;hyphens:auto}
  p{margin:0;text-wrap:pretty}
</style>
</head>
<body>
<div data-screen-label="Mobil Formular" style="width:390px;background:#0B2E59;border-radius:28px;padding:10px;border:1px solid #D6E4F0">
      <div style="background:#fff;border-radius:20px;overflow:hidden;height:780px;display:flex;flex-direction:column">
        <div style="height:34px;background:#0B2E59;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font:600 12px 'Source Sans 3',sans-serif"><span>09:41</span><span>5G · 100%</span></div>
        <div style="height:60px;border-bottom:1px solid #D6E4F0;display:flex;align-items:center;gap:12px;padding:0 18px;flex:none">
          <div style="width:46px;height:46px;display:flex;align-items:center;font:600 22px 'Libre Franklin',sans-serif;color:#0B2E59">‹</div>
          <span style="font:600 16px 'Libre Franklin',sans-serif">Angebot anfordern</span>
        </div>
        <div style="flex:none;padding:14px 18px 0">
          <div style="display:flex;gap:6px">
            <span style="flex:1;height:4px;background:#0F5AA6;border-radius:2px"></span>
            <span style="flex:1;height:4px;background:#D6E4F0;border-radius:2px"></span>
            <span style="flex:1;height:4px;background:#D6E4F0;border-radius:2px"></span>
          </div>
          <div style="margin-top:10px;font:600 13px 'Source Sans 3',sans-serif;color:#5B7391">Schritt 1 von 3 · Unternehmen</div>
        </div>
        <div style="flex:1;padding:18px;display:flex;flex-direction:column;gap:16px;overflow:hidden">
          <div>
            <label style="display:block;font:600 13.5px 'Source Sans 3',sans-serif">Firmenname *</label>
            <div style="margin-top:6px;height:50px;border:1px solid #D6E4F0;border-radius:6px;display:flex;align-items:center;padding:0 12px;font-size:16px">Alpenlust Reisen GmbH</div>
          </div>
          <div>
            <label style="display:block;font:600 13.5px 'Source Sans 3',sans-serif">Rechtsform *</label>
            <div style="margin-top:6px;height:50px;border:1px solid #D6E4F0;border-radius:6px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:16px"><span>GmbH</span><span style="color:#5B7391;font-size:12px">▾</span></div>
          </div>
          <div>
            <label style="display:block;font:600 13.5px 'Source Sans 3',sans-serif">Jahresumsatz Pauschalreisen *</label>
            <div style="margin-top:6px;height:50px;border:1px solid #0F5AA6;border-radius:6px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:16px"><span>1–5 Mio. €</span><span style="color:#0F5AA6;font-size:12px">▾</span></div>
          </div>
          <div>
            <label style="display:block;font:600 13.5px 'Source Sans 3',sans-serif">Firmensitz *</label>
            <div style="margin-top:6px;height:50px;border:1px solid #D6E4F0;border-radius:6px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:16px"><span>Deutschland</span><span style="color:#5B7391;font-size:12px">▾</span></div>
          </div>
          <p style="font-size:13.5px;line-height:1.5;color:#5B7391">Unterlagen laden Sie später hoch — nach der Eingangsbestätigung.</p>
        </div>
        <div style="flex:none;border-top:1px solid #D6E4F0;padding:10px 14px;display:flex;gap:10px">
          <div style="width:96px;height:50px;border:1px solid #0B2E59;border-radius:6px;display:flex;align-items:center;justify-content:center;font:600 15.5px 'Libre Franklin',sans-serif;color:#0B2E59">Zurück</div>
          <div style="flex:1;height:50px;background:#0F5AA6;color:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font:600 15.5px 'Libre Franklin',sans-serif">Weiter</div>
        </div>
      </div>
    </div>
</body>
</html>
